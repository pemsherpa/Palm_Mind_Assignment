services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      DATABASE_URL: sqlite:////data/palm_mind.db
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    volumes:
      - api-data:/data
    depends_on:
      - qdrant
      - redis

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  api-data:
  qdrant-data:
